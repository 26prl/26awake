<body class="home lost">
  <canvas class="lost-static" id="lost-static" aria-hidden="true"></canvas>
  <div class="home-center lost-center">
    <!-- your text picture goes here: save it as static/icons/404.png (transparent PNG works best).
         Until that file exists this slot stays empty. -->

  <script>
    // TV static behind everything: a tiny noise canvas, stretched over the page, redrawn ~12 times a second
    (() => {
      const c = document.getElementById("lost-static"), x = c.getContext("2d");
      c.width = 160; c.height = 90;
      const img = x.createImageData(160, 90);
      const draw = () => {
        for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
        x.putImageData(img, 0, 0);
      };
      draw();
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) setInterval(() => { if (!document.hidden) draw(); }, 80);
    })();
  </script>
