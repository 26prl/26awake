<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2048 · 26awake</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <a class="scatter" href="./">go back</a>
  <main class="page">
    <h1 data-avoid>2048</h1>
    <p class="muted small" data-avoid>Arrows / WASD or swipe. Your game and best score are saved on this device.</p>
    <div class="g8" data-avoid>
      <div class="g8-head">
        <span>Score <b id="g8-score">0</b></span>
        <span class="muted">Best <b id="g8-best">0</b></span>
      </div>
      <div class="g8-board" id="g8-board" tabindex="0" aria-label="2048 board">
        <div class="g8-grid" id="g8-grid"></div>
        <div class="g8-overlay" id="g8-overlay" hidden>
          <p id="g8-msg"></p>
          <div class="g8-actions">
            <button class="btn" id="g8-keep" type="button" hidden>Keep going</button>
            <button class="btn" id="g8-new" type="button">New game</button>
          </div>
        </div>
      </div>
      <div class="g8-foot"><span></span><button class="g8-reset" id="g8-reset" type="button">Start over</button></div>
    </div>
  </main>
  <script src="games.js"></script>
  <script src="scatter.js"></script>
</body>
</html>
