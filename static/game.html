<h1>~ 2048 ~</h1>
<p><font face="Arial" size="2">use the <b>arrow keys</b> (or WASD) to move the tiles. on a phone just swipe.<br>
when 2 tiles with the same number touch they <font color="red"><b>MERGE INTO ONE!!!</b></font> try to get to 2048 :)</font></p>
