# Checks the news every 6 minutes.
#
# Every check pushes its results to the `data` branch. Open pages fetch that branch straight from GitHub
# (the repository must be public) and update themselves without reloading, so Vercel does not need to
# redeploy for new articles. The `site` branch, which Vercel deploys, is only republished when the site's
# own files change, and once an hour as a fallback — about 24 deployments a day, inside Vercel's free limit.
name: Collect and publish

on:
  schedule:
    # Every 6 minutes. Keep TRACKER_SCHEDULE_MINUTES below in sync so pages know when to expect a check.
    - cron: "*/6 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Claude SDK (only used when ANTHROPIC_API_KEY is set)
        if: env.ANTHROPIC_API_KEY != ''
        run: pip install -r requirements.txt

      - name: Restore the database from the last check
        run: |
          mkdir -p data
          for branch in data site; do
            if git fetch --depth=1 origin "$branch" 2>/dev/null && git show "origin/$branch:.data/tracker.db" > data/tracker.db; then
              echo "restored from $branch"; break
            fi
            rm -f data/tracker.db
          done
          git fetch --depth=1 origin site 2>/dev/null || true

      - name: Collect and export
        env:
          TRACKER_SCHEDULE_MINUTES: "0,6,12,18,24,30,36,42,48,54"
          TRACKER_PUBLISH_DELAY_MINUTES: "2"
          TRACKER_LIVE_REPO: ${{ github.repository }}
          TRACKER_LIVE_BRANCH: data
        run: python -m tracker --sync-topics --once --export public

      - name: Push this check's data (pages pick it up live)
        run: |
          out="$RUNNER_TEMP/databranch"
          mkdir -p "$out/.data"
          cp -r public/data "$out/data"
          cp data/tracker.db "$out/.data/tracker.db"
          echo '{ "git": { "deploymentEnabled": false } }' > "$out/vercel.json"
          cd "$out"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Check $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "$PUSH_URL" data

      - name: Decide whether to redeploy the site
        id: decide
        run: |
          reason=""
          if git rev-parse -q --verify origin/site >/dev/null; then
            age=$(( $(date +%s) - $(git log -1 --format=%ct origin/site) ))
            mkdir -p "$RUNNER_TEMP/prev" && git archive origin/site | tar -x -C "$RUNNER_TEMP/prev"
            if ! diff -rq --exclude=data --exclude=.data --exclude=vercel.json --exclude=.nojekyll \
                 "$RUNNER_TEMP/prev" public >/dev/null; then
              reason="site files changed"
            elif [ "$age" -gt 3300 ]; then
              reason="hourly refresh"
            fi
          else
            reason="first publish"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "$reason" ]; then reason="manual run"; fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Redeploy: ${reason:-no, pages update live from the data branch}"

      - name: Publish the site branch
        if: steps.decide.outputs.reason != ''
        run: |
          mkdir -p public/.data
          cp data/tracker.db public/.data/tracker.db
          cp deploy/vercel.json public/vercel.json
          touch public/.nojekyll
          cd public
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Site update $(date -u +%Y-%m-%dT%H:%MZ): ${{ steps.decide.outputs.reason }}"
          git push -qf "$PUSH_URL" site
