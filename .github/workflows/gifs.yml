# When static/gifs.json changes: turn Tenor page links into direct GIF links (tools/resolve_gifs.py),
# commit the result, then start "Collect and publish" with a redeploy so the GIF wall updates.
name: Resolve GIF links

on:
  push:
    paths: ["static/gifs.json", "tools/resolve_gifs.py"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# One at a time; a run that finds the work already pushed by another just stops.
concurrency:
  group: gifs
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve Tenor links
        run: python tools/resolve_gifs.py
      - name: Commit resolved links
        run: |
          if git diff --quiet static/gifs.json; then echo "nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Resolve GIF links"
          git fetch -q origin "${GITHUB_REF_NAME}"
          if ! git rebase -q "origin/${GITHUB_REF_NAME}"; then
            git rebase --abort
            echo "the branch moved on with these links already resolved"; exit 0
          fi
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
      - name: Publish the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref "${GITHUB_REF_NAME}" -f redeploy=true
